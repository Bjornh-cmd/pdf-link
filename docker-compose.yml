services:
  web:
    build: .
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      UPLOAD_DIR: /data/uploads
      DATA_DIR: /data/app
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      EMAIL_FROM: ${EMAIL_FROM:-pdf@support.snubstad.nl}
      ALLOWED_UPLOAD_EMAIL: ${ALLOWED_UPLOAD_EMAIL:-bjornhoutman14@gmail.com}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
    volumes:
      - pdf_uploads:/data/uploads
      - app_data:/data/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pdf_uploads:
  app_data:
